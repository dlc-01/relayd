name: CI

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build server
        run: go build ./cmd/server/...

      - name: Build client
        run: go build ./cmd/client/...

      - name: Run tests
        run: go test ./... -v -timeout 30s -race

      - name: Vet
        run: go vet ./...
name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v -timeout 30s -race

      - name: Build server
        run: GOOS=linux GOARCH=amd64 go build -o relayd-server ./cmd/server

      - name: Build client
        run: GOOS=linux GOARCH=amd64 go build -o relayd-client ./cmd/client

      - name: Build relayd CLI
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-X github.com/dlc-01/relayd/cmd/relayd/cmd.Version=$(git describe --tags --always --dirty)" -o relayd ./cmd/relayd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            relayd-server
            relayd-client
            relayd

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build server for linux
        run: GOOS=linux GOARCH=amd64 go build -o relayd-server ./cmd/server

      - name: Build relayd CLI
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-X github.com/dlc-01/relayd/cmd/relayd/cmd.Version=$(git describe --tags --always --dirty)" -o relayd ./cmd/relayd

      - name: Check binaries exist
        run: ls -la relayd-server relayd

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy binaries to VPS
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p /opt/relayd && chmod 755 /opt/relayd"
          scp -i ~/.ssh/deploy_key \
            relayd-server \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/relayd/relayd-server.new
          scp -i ~/.ssh/deploy_key \
            relayd \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/relayd/relayd.new
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mv /opt/relayd/relayd-server.new /opt/relayd/relayd-server && \
             mv /opt/relayd/relayd.new /opt/relayd/relayd && \
             chmod +x /opt/relayd/relayd-server /opt/relayd/relayd"

      - name: Update systemd and restart
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash << 'EOF'
            cat > /etc/systemd/system/relayd-server.service << 'UNIT'
          [Unit]
          Description=Relayd Server
          After=network.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/relayd
          ExecStart=/opt/relayd/relayd-server
          Restart=on-failure
          RestartSec=5s

          Environment=RELAYD_CONTROL_ADDR=0.0.0.0:7000
          Environment=RELAYD_DATA_ADDR=0.0.0.0:7001
          Environment=RELAYD_HTTP_ADDR=0.0.0.0:80
          Environment=RELAYD_TLS_ADDR=0.0.0.0:443
          Environment=RELAYD_TLS_CERT=/etc/letsencrypt/live/${{ secrets.TLS_DOMAIN }}/fullchain.pem
          Environment=RELAYD_TLS_KEY=/etc/letsencrypt/live/${{ secrets.TLS_DOMAIN }}/privkey.pem
          Environment=RELAYD_TLS_DOMAIN=${{ secrets.TLS_DOMAIN }}
          Environment=RELAYD_MIN_PORT=10000
          Environment=RELAYD_MAX_PORT=60000
          Environment=RELAYD_TOKEN=${{ secrets.RELAYD_TOKEN }}
          Environment=RELAYD_SESSION_TTL=24h
          Environment=RELAYD_TG_TOKEN=${{ secrets.RELAYD_TG_TOKEN }}
          Environment=RELAYD_TG_CHAT_ID=${{ secrets.RELAYD_TG_CHAT_ID }}

          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=relayd-server

          [Install]
          WantedBy=multi-user.target
          UNIT

            systemctl daemon-reload
            systemctl enable relayd-server
            systemctl restart relayd-server
            systemctl status relayd-server
          EOF

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build binaries
        run: |
          VERSION=$(git describe --tags --always --dirty)
          LDFLAGS="-X github.com/dlc-01/relayd/cmd/relayd/cmd.Version=${VERSION}"

          GOOS=linux   GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o relayd-linux-amd64   ./cmd/relayd
          GOOS=darwin  GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o relayd-darwin-arm64  ./cmd/relayd
          GOOS=darwin  GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o relayd-darwin-amd64  ./cmd/relayd
          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o relayd-windows-amd64.exe ./cmd/relayd

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            relayd-linux-amd64
            relayd-darwin-arm64
            relayd-darwin-amd64
            relayd-windows-amd64.exe
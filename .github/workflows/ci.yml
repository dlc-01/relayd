name: CI

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v -timeout 30s -race

      - name: Build server
        run: GOOS=linux GOARCH=amd64 go build -o relayd-server ./cmd/server

      - name: Build client
        run: GOOS=linux GOARCH=amd64 go build -o relayd-client ./cmd/client

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            relayd-server
            relayd-client

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build server for linux
        run: GOOS=linux GOARCH=amd64 go build -o relayd-server ./cmd/server

      - name: Check binary exists
        run: ls -la relayd-server

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy binary to VPS
        run: |
            ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "mkdir -p /opt/relayd && chmod 755 /opt/relayd"
            scp -i ~/.ssh/deploy_key \
              relayd-server \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/relayd/relayd-server.new
            ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "mv /opt/relayd/relayd-server.new /opt/relayd/relayd-server && chmod +x /opt/relayd/relayd-server"

      - name: Update systemd and restart
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash << 'EOF'
            chmod +x /opt/relayd/relayd-server

            cat > /etc/systemd/system/relayd-server.service << 'UNIT'
          [Unit]
          Description=Relayd Server
          After=network.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/relayd
          ExecStart=/opt/relayd/relayd-server
          Restart=on-failure
          RestartSec=5s

          Environment=RELAYD_CONTROL_ADDR=0.0.0.0:7000
          Environment=RELAYD_DATA_ADDR=0.0.0.0:7001
          Environment=RELAYD_HTTP_ADDR=0.0.0.0:80
          Environment=RELAYD_TLS_ADDR=0.0.0.0:443
          Environment=RELAYD_TLS_CERT=/etc/letsencrypt/live/${{ secrets.TLS_DOMAIN }}/fullchain.pem
          Environment=RELAYD_TLS_KEY=/etc/letsencrypt/live/${{ secrets.TLS_DOMAIN }}/privkey.pem
          Environment=RELAYD_TLS_DOMAIN=${{ secrets.TLS_DOMAIN }}
          Environment=RELAYD_MIN_PORT=10000
          Environment=RELAYD_MAX_PORT=60000
          Environment=RELAYD_TOKEN=${{ secrets.RELAYD_TOKEN }}
          Environment=RELAYD_SESSION_TTL=24h
          Environment=RELAYD_TG_TOKEN=${{ secrets.RELAYD_TG_TOKEN }}
          Environment=RELAYD_TG_CHAT_ID=${{ secrets.RELAYD_TG_CHAT_ID }}

          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=relayd-server

          [Install]
          WantedBy=multi-user.target
          UNIT

            systemctl daemon-reload
            systemctl enable relayd-server
            systemctl restart relayd-server
            systemctl status relayd-server
          EOF